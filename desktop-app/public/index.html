<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BrightSite Studio</title>
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><img src="/generator/img/brightsite-logo.png" alt="BrightSite" class="logo"><span class="app-name">Studio</span></div>
  <div class="topbar-actions">
    <button class="browser-link" id="browserLinkBtn" title="Copy a link colleagues can open in their own browser">Copy browser link</button>
    <button class="gear" id="gearBtn" title="Settings">⚙</button>
  </div>
</header>

<div class="notice-strip" id="noticeStrip" hidden></div>

<div class="view" id="builderView">
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div id="projectList"></div>
      <button class="new-project" id="newProjectBtn">+ Blank site</button>
    </aside>

    <section class="editor" id="editor">
    </section>

    <section class="preview-pane">
      <div class="preview-actions">
        <button id="openBrowserBtn">Open in browser</button>
        <button id="exportBtn" class="primary">Export folder</button>
      </div>
      <div class="preview-frame-wrap">
        <iframe id="preview"></iframe>
      </div>
    </section>
  </div>
</div>

<dialog id="settingsDialog">
  <h3>Settings</h3>
  <p class="dim">Nothing to configure here yet — Facebook/Google import needs no API key, and natural-language editing uses your local Claude Code sign-in automatically.</p>
  <button id="closeSettingsBtn">Close</button>
</dialog>

<!-- Shared, deterministic site generator — the same code that runs on
     brightsite.app. Loaded from the live repo (or bundled resources in
     the packaged app) so the desktop tool never drifts from it. -->
<script src="/generator/template-designs.js"></script>
<script src="/generator/fresh-templates.js"></script>
<script src="/generator/demo-generator.js"></script>
<script src="/generator/hero-brand-compositor.js"></script>

<script src="app.js"></script>
</body>
</html>
