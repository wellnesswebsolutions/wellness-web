<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A business owner entering their details into a website form">
  <defs>
    <linearGradient id="s1acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5B3A73"/><stop offset="100%" stop-color="#B98FC9"/>
    </linearGradient>
    <radialGradient id="s1glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#B98FC9" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#B98FC9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="s1field" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B98FC9" stop-opacity=".18"/><stop offset="100%" stop-color="#B98FC9" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="#F7F2EC"/>
  <ellipse cx="400" cy="280" rx="330" ry="250" fill="url(#s1glow)"/>

  <!-- form panel -->
  <rect x="132" y="104" width="536" height="392" rx="26" fill="#FFFFFF" stroke="#E7DED2" stroke-width="2"/>
  <circle cx="170" cy="146" r="6" fill="#E7DED2"/><circle cx="192" cy="146" r="6" fill="#E7DED2"/><circle cx="214" cy="146" r="6" fill="#E7DED2"/>
  <line x1="132" y1="180" x2="668" y2="180" stroke="#E7DED2" stroke-width="2"/>

  <!-- business owner chip -->
  <circle cx="196" cy="238" r="26" fill="#F2ECF6" stroke="#B98FC9" stroke-width="2"/>
  <circle cx="196" cy="230" r="9" fill="#5B3A73"/>
  <path d="M181 254c3-9 9-13 15-13s12 4 15 13" fill="#5B3A73"/>
  <rect x="238" y="224" width="150" height="12" rx="6" fill="#241B2E" opacity=".78"/>
  <rect x="238" y="246" width="98" height="10" rx="5" fill="#241B2E" opacity=".26"/>

  <!-- completed field -->
  <rect x="180" y="298" width="440" height="46" rx="14" fill="#FBF8F4" stroke="#E7DED2" stroke-width="2"/>
  <rect x="200" y="315" width="176" height="12" rx="6" fill="#241B2E" opacity=".34"/>

  <!-- active, glowing field with caret -->
  <rect x="172" y="356" width="456" height="62" rx="18" fill="url(#s1field)"/>
  <rect x="180" y="364" width="440" height="46" rx="14" fill="#FFFFFF" stroke="url(#s1acc)" stroke-width="2.5"/>
  <rect x="200" y="381" width="118" height="12" rx="6" fill="#5B3A73" opacity=".85"/>
  <rect x="326" y="374" width="2.5" height="26" rx="1.25" fill="#5B3A73"/>

  <!-- submit -->
  <rect x="452" y="436" width="168" height="44" rx="22" fill="url(#s1acc)"/>
  <rect x="486" y="453" width="100" height="10" rx="5" fill="#FFFFFF" opacity=".92"/>

  <!-- pointer -->
  <path d="M604 402l0 44 12-13 9 19 11-5-9-19 18-2z" fill="#241B2E" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
</svg>
