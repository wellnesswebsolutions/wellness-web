<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A personalised website preview appearing in a browser window">
  <defs>
    <linearGradient id="s2acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5B3A73"/><stop offset="100%" stop-color="#B98FC9"/>
    </linearGradient>
    <radialGradient id="s2glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#B98FC9" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#B98FC9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="s2hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5B3A73" stop-opacity=".92"/><stop offset="100%" stop-color="#B98FC9" stop-opacity=".72"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="#F7F2EC"/>
  <ellipse cx="400" cy="280" rx="330" ry="250" fill="url(#s2glow)"/>

  <!-- browser -->
  <rect x="120" y="96" width="560" height="368" rx="24" fill="#FFFFFF" stroke="#E7DED2" stroke-width="2"/>
  <circle cx="158" cy="136" r="6" fill="#E7DED2"/><circle cx="180" cy="136" r="6" fill="#E7DED2"/><circle cx="202" cy="136" r="6" fill="#E7DED2"/>
  <rect x="232" y="126" width="300" height="20" rx="10" fill="#F7F2EC"/>
  <line x1="120" y1="168" x2="680" y2="168" stroke="#E7DED2" stroke-width="2"/>

  <!-- rendered hero band -->
  <path d="M120 168h560v128H120z" fill="url(#s2hero)"/>
  <rect x="156" y="200" width="150" height="11" rx="5.5" fill="#FFFFFF" opacity=".62"/>
  <rect x="156" y="224" width="236" height="18" rx="9" fill="#FFFFFF" opacity=".95"/>
  <rect x="156" y="256" width="104" height="22" rx="11" fill="#FFFFFF"/>

  <!-- content cards -->
  <rect x="156" y="322" width="152" height="102" rx="14" fill="#FBF8F4" stroke="#E7DED2" stroke-width="2"/>
  <rect x="324" y="322" width="152" height="102" rx="14" fill="#FBF8F4" stroke="#E7DED2" stroke-width="2"/>
  <rect x="492" y="322" width="152" height="102" rx="14" fill="#FBF8F4" stroke="#E7DED2" stroke-width="2"/>
  <rect x="176" y="344" width="76" height="9" rx="4.5" fill="#241B2E" opacity=".3"/>
  <rect x="176" y="364" width="112" height="8" rx="4" fill="#241B2E" opacity=".16"/>
  <rect x="344" y="344" width="76" height="9" rx="4.5" fill="#241B2E" opacity=".3"/>
  <rect x="344" y="364" width="112" height="8" rx="4" fill="#241B2E" opacity=".16"/>
  <rect x="512" y="344" width="76" height="9" rx="4.5" fill="#241B2E" opacity=".3"/>
  <rect x="512" y="364" width="112" height="8" rx="4" fill="#241B2E" opacity=".16"/>

  <!-- laptop base -->
  <path d="M92 464h616l30 40H62z" fill="#FFFFFF" stroke="#E7DED2" stroke-width="2" stroke-linejoin="round"/>
  <rect x="352" y="476" width="96" height="8" rx="4" fill="#E7DED2"/>

  <!-- "appearing" sparkles -->
  <path d="M690 150l7 19 19 7-19 7-7 19-7-19-19-7 19-7z" fill="url(#s2acc)"/>
  <path d="M126 400l5 13 13 5-13 5-5 13-5-13-13-5 13-5z" fill="#B98FC9" opacity=".85"/>
</svg>
