<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A live website with SEO growth and ongoing update indicators">
  <defs>
    <linearGradient id="s3acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5B3A73"/><stop offset="100%" stop-color="#B98FC9"/>
    </linearGradient>
    <radialGradient id="s3glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#B98FC9" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#B98FC9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="s3fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B98FC9" stop-opacity=".42"/><stop offset="100%" stop-color="#B98FC9" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="#F7F2EC"/>
  <ellipse cx="400" cy="280" rx="330" ry="250" fill="url(#s3glow)"/>

  <!-- live site window -->
  <rect x="132" y="108" width="536" height="384" rx="26" fill="#FFFFFF" stroke="#E7DED2" stroke-width="2"/>
  <circle cx="170" cy="148" r="6" fill="#E7DED2"/><circle cx="192" cy="148" r="6" fill="#E7DED2"/><circle cx="214" cy="148" r="6" fill="#E7DED2"/>
  <rect x="240" y="138" width="188" height="20" rx="10" fill="#F7F2EC"/>
  <!-- live pill -->
  <rect x="536" y="134" width="98" height="28" rx="14" fill="#EAF6EE" stroke="#8FD08F" stroke-width="2"/>
  <circle cx="558" cy="148" r="6" fill="#3EA35E"/>
  <rect x="572" y="143" width="46" height="10" rx="5" fill="#2F7A47" opacity=".82"/>
  <line x1="132" y1="180" x2="668" y2="180" stroke="#E7DED2" stroke-width="2"/>

  <!-- growth chart -->
  <line x1="196" y1="416" x2="612" y2="416" stroke="#E7DED2" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="196" y1="416" x2="196" y2="216" stroke="#E7DED2" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M196 416v-38l68-30 70-34 68-46 70-42 70-44v234z" fill="url(#s3fill)"/>
  <path d="M196 378l68-30 70-34 68-46 70-42 70-44" fill="none" stroke="url(#s3acc)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="542" cy="182" r="10" fill="#5B3A73" stroke="#FFFFFF" stroke-width="3.5"/>

  <!-- bars -->
  <rect x="228" y="386" width="26" height="30" rx="7" fill="#B98FC9" opacity=".42"/>
  <rect x="286" y="366" width="26" height="50" rx="7" fill="#B98FC9" opacity=".52"/>
  <rect x="344" y="338" width="26" height="78" rx="7" fill="#B98FC9" opacity=".62"/>
  <rect x="402" y="308" width="26" height="108" rx="7" fill="#B98FC9" opacity=".72"/>

  <!-- SEO badge -->
  <rect x="452" y="436" width="216" height="60" rx="18" fill="#FFFFFF" stroke="#E7DED2" stroke-width="2"/>
  <circle cx="486" cy="466" r="17" fill="#F2ECF6"/>
  <circle cx="484" cy="464" r="8" fill="none" stroke="#5B3A73" stroke-width="3.5"/>
  <line x1="490" y1="470" x2="497" y2="477" stroke="#5B3A73" stroke-width="3.5" stroke-linecap="round"/>
  <rect x="516" y="452" width="122" height="10" rx="5" fill="#241B2E" opacity=".34"/>
  <rect x="516" y="472" width="78" height="9" rx="4.5" fill="#241B2E" opacity=".18"/>

  <!-- update indicator -->
  <path d="M622 232a34 34 0 1 1-10-24" fill="none" stroke="url(#s3acc)" stroke-width="5" stroke-linecap="round"/>
  <path d="M614 180v30h-30z" fill="#5B3A73"/>
</svg>
